<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <!-- Truck Emblem + SH Graphic -->
  <g transform="translate(10, 10)">
    <!-- Speedlines trailing behind the S -->
    <path d="M 0 35 L 80 35" stroke="#0b0f19" stroke-width="4" stroke-linecap="round" />
    <path d="M 15 48 L 75 48" stroke="#ff6600" stroke-width="4" stroke-linecap="round" />
    <path d="M 5 62 L 65 62" stroke="#0b0f19" stroke-width="4" stroke-linecap="round" />

    <!-- Stylized "S" (Dark Slate-Black) -->
    <path d="M 95 30 L 45 30 C 35 30 30 35 30 45 L 30 50 C 30 60 35 65 45 65 L 75 65 C 80 65 85 70 85 75 L 85 80 C 85 90 80 95 70 95 L 20 95" 
          fill="none" stroke="#0b0f19" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Stylized "H" (Orange) -->
    <path d="M 95 35 L 95 95 M 95 65 L 135 65 M 135 35 L 135 95" 
          fill="none" stroke="#ff6600" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Semi-Truck Cab Silhouette connected to H -->
    <!-- Cab shell structure -->
    <path d="M 135 55 L 175 55 C 190 55 195 60 200 70 L 215 90 L 245 90 C 250 90 252 93 252 98 L 252 110 L 135 110 Z" 
          fill="#0b0f19" />
    
    <!-- Windshield -->
    <path d="M 178 63 L 192 63 L 204 80 L 190 80 Z" fill="#ffffff" opacity="0.9" />

    <!-- Orange cab trim detailing -->
    <path d="M 145 75 L 175 75 L 185 88 L 145 88" fill="none" stroke="#ff6600" stroke-width="3" />

    <!-- Front wheel -->
    <circle cx="218" cy="110" r="14" fill="#0b0f19" stroke="#ffffff" stroke-width="3" />
    <circle cx="218" cy="110" r="6" fill="#ffffff" />
    
    <!-- Rear wheel (under cab) -->
    <circle cx="150" cy="110" r="14" fill="#0b0f19" stroke="#ffffff" stroke-width="3" />
    <circle cx="150" cy="110" r="6" fill="#ffffff" />
    
    <!-- Underglow/Ground Shadow line -->
    <path d="M 28 122 L 240 122" stroke="#ff6600" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Typography: SKYHAUL TRANSIT INC. -->
  <g transform="translate(265, 0)">
    <!-- SKYHAUL -->
    <text x="0" y="85" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="52" letter-spacing="-1">
      <tspan fill="#0b0f19">SKY</tspan>
      <tspan fill="#ff6600">HAUL</tspan>
    </text>
    
    <!-- Decorative side line, TRANSIT INC, side line -->
    <path d="M 0 114 L 35 114" stroke="#ff6600" stroke-width="2" stroke-linecap="round" />
    <text x="45" y="120" font-family="'Outfit', 'Inter', sans-serif" font-weight="700" font-size="17" letter-spacing="4.5" fill="#0b0f19">TRANSIT INC.</text>
    <path d="M 205 114 L 235 114" stroke="#ff6600" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
